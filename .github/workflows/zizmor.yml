name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 1 * * 5' # weekly at 01:21 UTC on Friday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@efc55838c9769c5476e0a5cf7183a8c5b4ae70a5 # v0.24.0
